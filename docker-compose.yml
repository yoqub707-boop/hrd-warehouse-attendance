version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: hrd_warehouse_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/var/www/html/uploads
    depends_on:
      - app
    networks:
      - hrd_network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrd_warehouse_app
    volumes:
      - ./:/var/www/html
      - ./uploads:/var/www/html/uploads
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=hrd_warehouse
      - DB_USERNAME=hrd_user
      - DB_PASSWORD=hrd_secret
    depends_on:
      - db
    networks:
      - hrd_network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: hrd_warehouse_mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: hrd_warehouse
      MYSQL_USER: hrd_user
      MYSQL_PASSWORD: hrd_secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "3306:3306"
    networks:
      - hrd_network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  hrd_network:
    driver: bridge
